name: Build and Test

# racecar fork-testbed patch. Changes from upstream:
#   1. workflow_dispatch gains leg/profile/racecar_run inputs alongside upstream's
#      impls/self-hosted, so racecar can drive a run and select the arm.
#   2. actions/checkout -> crashappsec/action-checkout in the linux job, which
#      wraps checkout and setup-chalk-action together (the internal pattern, cf.
#      dummy-deployments). `chalk:` is the single variable separating the arms.
#      get-matrix keeps plain actions/checkout: it only runs get-ci-matrix.py and
#      is not part of what we are measuring.
#   3. permissions gains id-token: write for the action's OIDC connect (upstream's
#      contents: read / packages: write are restated, since a permissions block
#      zeroes every unlisted scope).
#   4. A fail-closed assertion on the instrumented arm.
#   5. The macos (macos-12) and windows (windows-2022) jobs are removed: build
#      observables are linux-only, so those legs cannot be instrumented.
# Build and test COMMANDS are byte-identical to upstream.

permissions:
  contents: read
  packages: write
  id-token: write

on:
  push: {}
  pull_request: {}
  workflow_dispatch:
    inputs:
      impls:
        # Scoping, NOT fidelity: upstream defaults this to 'all', which is 112
        # Linux jobs x 6 heavy steps and would monopolise the shared runner pool
        # for hours. Trimmed to a representative 12 spanning native-compiled
        # (c, cpp, go, rust, haskell), VM/JIT (java, cs, js) and interpreted
        # (python3, ruby, perl, lua). Each name maps to exactly one IMPLS.yml
        # entry, so this is 12 jobs. Both arms use the same subset, so the
        # instrumented/baseline ratio is unaffected. Pass 'all' explicitly to
        # get the full matrix back.
        description: 'Space separated list of impls to test (or all)'
        required: true
        default: 'c cpp go rust haskell java cs js python3 ruby perl lua'
      self-hosted:
        description: 'Include self-hosted tests'
        required: true
        default: 'yes'
        options: ['yes', 'no']
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: instrumented
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""

run-name: "Build and Test ${{ inputs.leg || 'push' }} ${{ inputs.racecar_run }}"

env:
  # The one variable that separates the arms. On baseline, action-checkout skips
  # its Set up Chalk step entirely: no chalk, no curiosity, no residue.
  CHALK_ON: ${{ github.event_name == 'workflow_dispatch' && inputs.leg != 'baseline' }}

jobs:
  get-matrix:
    runs-on: ubuntu-24.04
    outputs:
      do-linux: ${{ steps.get-matrix-step.outputs.do_linux }}
      matrix-linux: ${{ steps.get-matrix-step.outputs.linux }}
    steps:
      - uses: actions/checkout@v4
      - id: files
        if: ${{ github.event_name != 'workflow_dispatch' }}
        uses: kanaka/get-changed-files@v4
        with:
          default-base: master
      - id: get-matrix-step
        run: |
          export OVERRIDE_IMPLS="${{ github.event.inputs.impls }}" # "
          echo "OVERRIDE_IMPLS: ${OVERRIDE_IMPLS}"
          ./get-ci-matrix.py ${{ steps.files.outputs.all }} > "${GITHUB_OUTPUT}"

  linux:
    needs: get-matrix
    if: ${{ needs.get-matrix.outputs.do-linux == 'true' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.get-matrix.outputs.matrix-linux) }}
    steps:
      - uses: crashappsec/action-checkout@main
        with:
          chalk: ${{ env.CHALK_ON }}
          profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
          # Default is best-effort; a silently-uninstrumented run is a corrupt
          # data point rather than a degraded one, so fail closed.
          observables_continue_on_error: false
          # Upstream used actions/checkout, which does not fetch LFS. Keep the
          # tree identical to what upstream CI builds.
          lfs: false
          fetch-depth: 0  # Need full history for voom like versions

      # Assert on the host-server socket, NOT on LD_PRELOAD: co-monitor's loader
      # clears LD_PRELOAD once it has injected so it does not cascade into every
      # child, so an empty LD_PRELOAD is what SUCCESS looks like from inside the
      # shell. Process name is no good either -- co-hostd daemonizes.
      - name: Assert instrumentation is live
        if: env.CHALK_ON == 'true'
        run: |
          test -n "${CURIOSITY_ROOT:-}" || { echo "::error::CURIOSITY_ROOT unset - observables never installed"; exit 1; }
          test -S "${CURIOSITY_SOCKET_NAME:?socket name unset}" || { echo "::error::co-hostd socket absent"; exit 1; }

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker Build/Push
        run: |
          export ${{ matrix.IMPL }}
          ./ci.sh docker-build-push ${IMPL}
      - name: Build
        run: |
          export ${{ matrix.IMPL }}
          ./ci.sh build ${IMPL}
      - name: Step Tests
        run: |
          export ${{ matrix.IMPL }}
          ./ci.sh test ${IMPL}
      - name: Regression Tests
        run: |
          export ${{ matrix.IMPL }}
          STEP=stepA REGRESS=1 HARD=1 OPTIONAL=0 ./ci.sh test ${IMPL}
      - name: Performance Tests
        run: |
          export ${{ matrix.IMPL }}
          ./ci.sh perf ${IMPL}
      - name: Self-hosted Tests
        if: ${{ github.event.inputs.self-hosted != 'no' }}
        run: |
          export ${{ matrix.IMPL }}
          if [ -n "${NO_SELF_HOST:-}" ]; then
            echo "Skipping self-host for ${IMPL} due to NO_SELF_HOST variable"
          else
            DO_SELF_HOST=1 ./ci.sh test ${IMPL}
            # Check that self-hosted mode really ran
            [ "`grep -a "mal-user>" test-mal-*${IMPL}.debug | wc -l`" -gt 800 ]
          fi
      - name: Print debug log
        if: failure()
        run: cat *.debug
      - name: Archive logs and debug output
        uses: actions/upload-artifact@v4
        with:
          name: logs.${{ matrix.IMPL }}
          path: |
            *.log
            *.debug
